name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Два пуша подряд не должны выкатываться внахлёст.
# cancel-in-progress: false — начатый деплой доводим до конца.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/timeofthestars/timeofthestars-frontend-2026-2027

jobs:
  build:
    name: Сборка образа
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Логин в ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Теги и метки
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # Сервер amd64 — одна платформа, кросс-сборка не нужна.
      # Сборка здесь, а не на сервере: nuxt build берёт до 2.5 ГБ,
      # а на проде всего 2 ГБ.
      - name: Сборка и пуш
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Выкатка на прод
    needs: build
    runs-on: ubuntu-latest
    # packages: read — чтобы отдать серверу временный GITHUB_TOKEN для ghcr.io.
    # Он живёт только пока идёт job, поэтому долгоживущий PAT на сервере не нужен.
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://timeofthestars.ru
    steps:
      - uses: actions/checkout@v4

      # Caddyfile и docker-compose.yml раньше правились на сервере руками,
      # из-за чего прод мог разъехаться с репозиторием. Теперь репозиторий —
      # источник правды и для них.
      - name: Синхронизировать конфиги прода
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,caddy/Caddyfile"
          target: /srv/timeofthestars

      - name: docker compose pull && up
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: GHCR_TOKEN,GHCR_ACTOR
          script: |
            set -euo pipefail
            cd /srv/timeofthestars
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            # Только web: Caddy уже лежит на сервере, а анонимный запрос к
            # Docker Hub упирается в лимит (429) и валит всю выкатку.
            # Обновить Caddy: docker compose pull caddy на сервере.
            docker compose pull web
            # Поднимаем весь стек, а не только web: на первой выкатке Caddy
            # ещё не существует, а дальше compose его не тронет, пока не
            # поменяется его конфиг или образ.
            # --wait: если новый контейнер не станет healthy, деплой упадёт
            # с ошибкой, а не оставит нас с молча сломанным сайтом.
            docker compose up -d --wait --wait-timeout 120
            # up не пересоздаёт Caddy, если поменялось только содержимое
            # Caddyfile, — он смонтирован томом. Перечитываем явно.
            #
            # Но сперва убеждаемся, что контейнер вообще видит новый файл.
            # Раньше конфиг монтировался одиночным файлом, scp заменял его
            # через новый inode, монтирование застывало на старом содержимом,
            # и reload молча применял устаревший конфиг. Теперь монтируется
            # каталог, а эта проверка не даст ошибке снова пройти незаметно.
            host_sum=$(md5sum caddy/Caddyfile | cut -d" " -f1)
            cont_sum=$(docker compose exec -T caddy md5sum /etc/caddy/Caddyfile | cut -d" " -f1)
            if [ "$host_sum" != "$cont_sum" ]; then
              echo "Caddy видит не тот конфиг: хост $host_sum, контейнер $cont_sum"
              exit 1
            fi
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            docker image prune -f
            # токен временный, но и его на диске не оставляем
            docker logout ghcr.io
            docker compose ps
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}

      - name: Проверка, что сайт отвечает
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://timeofthestars.ru/ || true)
            if [ "$code" = "200" ]; then
              echo "OK: сайт отдал 200"
              exit 0
            fi
            echo "попытка $i: HTTP $code, жду 5 с"
            sleep 5
          done
          echo "Сайт не отдал 200 после выкатки"
          exit 1
